name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Package
        run: |
          tar -czf karaconf-aarch64-apple-darwin.tar.gz -C target/aarch64-apple-darwin/release karaconf
          tar -czf karaconf-x86_64-apple-darwin.tar.gz  -C target/x86_64-apple-darwin/release  karaconf

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            karaconf-aarch64-apple-darwin.tar.gz
            karaconf-x86_64-apple-darwin.tar.gz
